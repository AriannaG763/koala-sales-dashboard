name: Refresh dashboard

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch fresh data
        run: |
          curl -sS -f -L "https://docs.google.com/spreadsheets/d/1lOF8xoIHvH1XNaVqCjZB-rbCxZ65bBA-SxJr1x6KhgA/export?format=csv&gid=78735818" -o data.csv
          wc -l data.csv
          head -1 data.csv

      - name: Aggregate
        run: node aggregate.js data.csv .

      - name: Build
        run: python3 build.py .

      - name: Validate
        run: |
          python3 -c "
          import re
          with open('koala-sales-dashboard.html') as f:
              html = f.read()
          assert '__DAILY_CAT_PRODUCT_JSON__' not in html
          assert '__PRODUCT_DETAIL_DAILY_JSON__' not in html
          assert '__GEN_DATE__' not in html
          m = re.search(r'<script>(.*)</script>', html, re.S)
          with open('extracted.js', 'w') as out:
              out.write(m.group(1))
          "
          node --check extracted.js

      - name: Prepare Pages output
        run: |
          mkdir -p _site
          cp koala-sales-dashboard.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
